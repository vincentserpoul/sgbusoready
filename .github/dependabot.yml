---
# Weekly, grouped dependency updates: one PR per ecosystem instead of one
# per package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised or
    # yanked version is usually caught before it reaches this repo.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised or
    # yanked version is usually caught before it reaches this repo.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      cargo:
        patterns: ['*']

  # The Android shell (Kotlin glue + Gradle plugins) under android/.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised or
    # yanked version is usually caught before it reaches this repo.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      gradle:
        patterns: ['*']
