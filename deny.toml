# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# ============================================================================
# ADVISORIES — known security vulnerabilities in dependencies
# ============================================================================
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Add specific RUSTSEC ignores here only with a justification comment.
ignore = [
  # Unmaintained (not vulnerable) transitive deps of Slint 1.18's desktop
  # stack, none with an upstream fix available:
  # - pin-utils: via spin_on <- slint-build / slint-macros.
  # - ttf-parser: via ab_glyph <- sctk-adwaita (Wayland decorations).
  # - zbus_names / zvariant / zvariant_derive: via atspi <- accesskit_unix
  #   (Linux accessibility). Revisit on each Slint bump.
  "RUSTSEC-2026-0441",
  "RUSTSEC-2026-0192",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0372",
]

# ============================================================================
# LICENSES — dependency licenses checked against an allowlist
# ============================================================================
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
  # This app is licensed GPL-3.0-only (see LICENSE), which is also the license we
  # elect for Slint (tri-licensed GPL-3.0 / Royalty-Free / paid Software).
  "GPL-3.0-only",
]
confidence-threshold = 0.8

# ============================================================================
# BANS — deny or allow specific crates or versions
# ============================================================================
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

# ============================================================================
# SOURCES — controls where crates can be sourced from
# ============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
