# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# ============================================================================
# ADVISORIES — known security vulnerabilities in dependencies
# ============================================================================
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Report unmaintained crates only when we depend on them directly: transitive
# ones (via Slint's desktop stack: winit, accesskit, zbus) are not ours to
# replace. This is the default from cargo-deny 0.22, set explicitly so older
# versions agree. Vulnerabilities are always reported for the whole graph.
unmaintained = "workspace"
# No advisories are currently ignored. If an unmaintained transitive dependency
# we cannot upgrade ourselves shows up, list its RUSTSEC id here with a comment,
# and prune it once it no longer matches (cargo-deny warns `advisory-not-detected`).
ignore = []

# ============================================================================
# LICENSES — dependency licenses checked against an allowlist
# ============================================================================
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
  # This app is licensed GPL-3.0-only (see LICENSE), which is also the license we
  # elect for Slint (tri-licensed GPL-3.0 / Royalty-Free / paid Software).
  "GPL-3.0-only",
]
confidence-threshold = 0.8

# ============================================================================
# BANS — deny or allow specific crates or versions
# ============================================================================
[bans]
# Duplicate crate versions are all transitive (Slint, winit, accesskit) and not
# something we can resolve from this workspace, so don't warn.
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

# ============================================================================
# SOURCES — controls where crates can be sourced from
# ============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
